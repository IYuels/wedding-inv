<section class="wedding-details section" id="weddingDetails">
  <div class="page-container wedding-details__container">
    <div class="wedding-details__card">
      <div class="wedding-details__content">

        <p class="wedding-details__eyebrow">
          THE WEDDING
        </p>

        <h2 class="section-title">
          Save the Date
        </h2>

        <div class="wedding-details__grid">

          <div class="wedding-details__item">
            <span class="wedding-details__label">
              Date
            </span>

            <h3>
              Month 00, 2026
            </h3>

            <p>
              00:00 PM
            </p>

            <button
              type="button"
              class="button wedding-details__calendar"
              id="addToCalendar"
            >
              Add to Calendar
            </button>
          </div>

          <div class="wedding-details__divider"></div>

          <div class="wedding-details__item">
            <span class="wedding-details__label">
              Venue
            </span>

            <h3>
              Venue Name
            </h3>

            <p>
              Full venue address goes here
            </p>
          </div>

        </div>

      </div>
    </div>
  </div>
</section>
