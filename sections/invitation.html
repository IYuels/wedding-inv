<section class="invitation section" id="invitation">
  <div class="page-container invitation__container">
    <div class="invitation__main">
      <div class="invitation__paper">
        <div class="invitation__paper-content">
          <p class="invitation__eyebrow">SAVE THE DATE</p>

          <h1 class="invitation__names">
            <span>Rex</span>
            <small>&</small>
            <span>Trisha</span>
          </h1>
        </div>

        <div class="invitation__flower invitation__flower--disc">
          <img src="./assets/flower.webp" alt="">
        </div>

        <button
          class="music-disc"
          id="musicDisc"
          type="button"
          aria-label="Pause wedding music"
        >
          <img
            src="./assets/disc.webp"
            alt="Music disc"
            class="music-disc__record"
          >
        </button>

        <div class="invitation__rings">
          <img src="./assets/ring.webp" alt="Wedding rings">
        </div>

        <div class="invitation__flower invitation__flower--plate">
          <img src="./assets/flower.webp" alt="">
        </div>

        <div class="invitation__plate">
          <div class="invitation__plate-content">
            <span>You are</span>
            <span>invited</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="countdown">
    <p>The big day is in</p>

    <div class="countdown__numbers" id="weddingCountdown">
      <div>
        <strong data-days>00</strong>
      </div>

      <span>:</span>

      <div>
        <strong data-hours>00</strong>
      </div>

      <span>:</span>

      <div>
        <strong data-minutes>00</strong>
      </div>

      <span>:</span>

      <div>
        <strong data-seconds>00</strong>
      </div>
    </div>
  </div>
</section>
