<section class="dress-code section" id="dressCode">
  <div class="page-container dress-code__container">
    <p class="section-eyebrow">CELEBRATE WITH US</p>

    <h2 class="section-title">
      Dress Code
    </h2>

    <p class="dress-code__intro">
      We would love to see our favorite people dressed in colors inspired by nature.
    </p>

    <div class="dress-code__image">
      <img src="./assets/dress-code.webp" alt="Wedding dress code inspiration">
    </div>

    <div class="dress-code__palette">
      <div class="dress-code__color">
        <span style="--swatch-color: #203b2c;"></span>
        <p>Forest</p>
      </div>

      <div class="dress-code__color">
        <span style="--swatch-color: #526b4f;"></span>
        <p>Sage</p>
      </div>

      <div class="dress-code__color">
        <span style="--swatch-color: #899681;"></span>
        <p>Olive</p>
      </div>

      <div class="dress-code__color">
        <span style="--swatch-color: #5a4739;"></span>
        <p>Walnut</p>
      </div>

      <div class="dress-code__color">
        <span style="--swatch-color: #8b725c;"></span>
        <p>Mocha</p>
      </div>

      <div class="dress-code__color">
        <span style="--swatch-color: #b19a80;"></span>
        <p>Sand</p>
      </div>
    </div>

    <div class="dress-code__guide">
      <div class="dress-code__allowed">
        <span class="dress-code__icon">✓</span>

        <div>
          <strong>Any shade of green & brown</strong>
        </div>
      </div>

      <div class="dress-code__avoid">
        <span class="dress-code__icon">X</span>

        <div>
          <strong>Kindly avoid white attire</strong>
        </div>
      </div>
    </div>

    <p class="dress-code__note">
      Semi-formal · Garden Elegant
    </p>
  </div>
</section>
