<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4a6253">

  <title>Thank You</title>

  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/thank-you.css">
</head>

<body class="thank-you-page">
  <main>
    <section class="thank-you-hero">
      <div class="thank-you-hero__content page-container">
        <h1 class="section-title">
          Thank You!
        </h1>

        <p>
          Thank you for saying yes to celebrating this beautiful day with us.
          Your presence, love, and blessing mean more than words can say,
          and we cannot wait to share this special moment with you.
        </p>

        <span>
          See you on our special day.
        </span>
      </div>
    </section>

    <section class="attendees">
      <div class="page-container attendees__container">
        <div class="attendees-card">
          <div class="attendees-card__content">

            <h2 class="section-title">
              Attendees
            </h2>

            <div
              class="attendees-list"
              id="attendeesList"
            >
              <p class="attendees-list__loading">
                Loading our lovely guests...
              </p>
            </div>

            <div
              class="attendees-pagination"
              id="attendeesPagination"
              hidden
            >
              <button
                class="attendees-pagination__button"
                id="prevPage"
                type="button"
                aria-label="Previous attendees page"
              >
                ← Prev
              </button>

              <span
                class="attendees-pagination__count"
                id="pageCount"
              >
                01
              </span>

              <button
                class="attendees-pagination__button"
                id="nextPage"
                type="button"
                aria-label="Next attendees page"
              >
                Next →
              </button>
            </div>

          </div>
        </div>
      </div>
    </section>
  </main>

  <script
    type="module"
    src="./js/thank-you.js"
  ></script>
</body>
</html>
